[project]
name = "reminder"
version = "0.1.0"
description = "Personal desktop reminders for macOS"
requires-python = ">=3.12"
dependencies = [
    "desktop-notifier>=6.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
